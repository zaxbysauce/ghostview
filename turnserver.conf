# coturn configuration for GhostView
#
# IMPORTANT before production use:
#   - Replace `user=ghost:supersecretpassword` with a strong password
#     (or switch to short-term credentials via use-auth-secret + static-auth-secret).
#   - Set `external-ip` to your server's public IP if behind NAT.
#   - Set `realm` and `server-name` to your domain.
#   - Consider TLS via `cert`/`pkey` for TURNS.
#
# The `denied-peer-ip` ranges block TURN from relaying to private subnets,
# preventing the relay from being abused to reach internal services.

listening-port=3478
tls-listening-port=5349

# Uncomment and point at real certs for TURNS:
# cert=/etc/coturn/certs/cert.pem
# pkey=/etc/coturn/certs/key.pem

# Public domain/realm — change for your deployment.
realm=ghostview.local
server-name=ghostview.local

# Long-term credential mechanism.
lt-cred-mech
user=ghost:supersecretpassword

# Resource limits.
total-quota=100
stale-nonce=600

# Security: fingerprinting and anti-loopback rules.
fingerprint
no-multicast-peers
no-loopback-peers

# Block relay to RFC1918 private ranges and other reserved blocks.
denied-peer-ip=0.0.0.0-0.255.255.255
denied-peer-ip=10.0.0.0-10.255.255.255
denied-peer-ip=100.64.0.0-100.127.255.255
denied-peer-ip=127.0.0.0-127.255.255.255
denied-peer-ip=169.254.0.0-169.254.255.255
denied-peer-ip=172.16.0.0-172.31.255.255
denied-peer-ip=192.0.0.0-192.0.0.255
denied-peer-ip=192.0.2.0-192.0.2.255
denied-peer-ip=192.88.99.0-192.88.99.255
denied-peer-ip=192.168.0.0-192.168.255.255
denied-peer-ip=198.18.0.0-198.19.255.255
denied-peer-ip=198.51.100.0-198.51.100.255
denied-peer-ip=203.0.113.0-203.0.113.255
denied-peer-ip=240.0.0.0-255.255.255.255

# If behind NAT (common on a VPS with a single public IP), set this:
# external-ip=203.0.113.45

# Log to stdout for docker.
no-stdout-log=false
log-file=stdout
simple-log
