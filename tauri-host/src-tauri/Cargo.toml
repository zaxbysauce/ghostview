[package]
name = "ghostview-pro"
version = "0.1.0"
edition = "2021"
description = "GhostView Pro — portable WebRTC screen-share host"
authors = ["GhostView"]

[lib]
name = "ghostview_pro_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[[bin]]
name = "ghostview-pro"
path = "src/main.rs"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time"] }
tokio-tungstenite = { version = "0.23", features = ["rustls-tls-native-roots"] }
futures-util = "0.3"
thiserror = "1"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
url = "2"

# WebRTC stack — mandatory. GhostView Pro's job is to establish a peer
# connection with the viewer; there is no scaffold path.
webrtc = "=0.11.0"
bytes = "1"

# VP9 software encoder — mandatory. Links against system libvpx via
# `env-libvpx-sys`. Install: `apt install libvpx-dev` (Linux),
# `brew install libvpx` (macOS), `vcpkg install libvpx:x64-windows` (Windows).
vpx-encode = { version = "0.6", features = ["vp9"] }

# Real screen capture — Windows only for Phase 1 (macOS/Linux planned).
# Pinned to 1.5.x: `FrameBuffer::as_nopadding_buffer` and the 8-arg
# `Settings::new` shape are stable there; later minor versions may reshape them.
[target.'cfg(target_os = "windows")'.dependencies]
windows-capture = "~1.5"

[dev-dependencies]
tokio = { version = "1", features = ["rt-multi-thread", "macros", "sync", "time", "process", "io-util", "net"] }
